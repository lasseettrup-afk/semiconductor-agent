name: Semiconductor Agent

on:
  schedule:
    - cron: "0 7 * * *"   # runs every day
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4

      - name: Install dependencies
        run: pip install yfinance

      - name: Run script
        run: python bot.py

---
